# H100 (sm_90) / A100 and A30 (sm_80)
#
#   module purge
#   module load WebProxy GCC/11.3.0 CUDA/12.1.1
#
#   export UV_PROJECT_ENVIRONMENT=/scratch/user/$USER/uv_envs/train_free_kv
#   export UV_CACHE_DIR=/scratch/user/$USER/uv_cache
#
#   uv sync
#   make i
#
# PyTorch must be pinned because flash-attn is a compiled PyTorch extension.
# The direct flash-attn wheel avoids a large CUDA source compilation.

[build-system]
requires = [
    "setuptools<81",
    "wheel",
    "packaging",
]
build-backend = "setuptools.build_meta"

[project]
name = "andpro"
version = "0.0.1"
requires-python = ">=3.11,<3.12"

dependencies = [
    # Required compatibility pin for flash-attn 2.4.0.
    "torch==2.1.2",
    # Requested exact versions.
    "transformers==4.44.2",
    "flash-attn==2.4.0",
    # Automatically resolved versions.
    "tokenizers",
    "accelerate",
    # Last 2.x release. datasets>=3.0 removed support for Hub repos that ship a
    # loading script, and THUDM/LongBench is exactly that (LongBench.py + data.zip),
    # so anything newer dies with "Dataset scripts are no longer supported".
    "datasets==2.21.0",
    "numpy==1.26.4",
    "tiktoken",
    "jieba",
    "rouge",
    "rouge_score",
    "nltk",
    "fuzzywuzzy",
    "python-Levenshtein",
    "fschat",
    "sentencepiece",
    "protobuf",
    "einops",
    "tqdm",
    "matplotlib",
    "ninja",
    "packaging",
    # torch 2.1 cpp_extension still uses pkg_resources.
    "setuptools>=68,<81",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
cache-dir = "/scratch/user/u.ab353540/uv_cache"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

# Prebuilt Linux x86_64 wheel for:
#   flash-attn 2.4.0
#   PyTorch 2.1
#   Python 3.11
#   CXX11 ABI false
#
# It contains Ampere sm_80 and Hopper sm_90 support.
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.4.0/flash_attn-2.4.0%2Bcu122torch2.1cxx11abiFALSE-cp311-cp311-linux_x86_64.whl" }
