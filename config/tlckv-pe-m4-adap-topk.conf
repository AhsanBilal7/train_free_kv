# =============================================================================
# A1 — tlckv-pe-m4-adap-topk
#
# Prob+Entropy confidence · 4 particles · Adaptive budget · Plain top-K
#
# Confidence weighting uses both average log-probability AND predictive entropy
# (Eq. 7-8): particles with high next-token uncertainty are down-weighted even
# if their log-probability is high.  Adaptive head-wise budget (Eq. 20) directs
# more tokens to heads where future-query perturbations are largest.  Chunk
# selection is plain top-K (no cosine diversity penalty).  Score aggregation is
# plain mean over window + particle queries (ROBUST_ALPHA=0, ROBUST_TOPK_BETA=1).
#
# Usage:
#   CONFIG_FILE=config/tlckv-pe-m4-adap-topk.conf bash scripts/run_h100.sh
# =============================================================================

MODEL_PATH    = mistralai/Mistral-7B-Instruct-v0.2
DATASET_PATH  = THUDM/LongBench
DATASET_NAME_LIST = qasper narrativeqa multifieldqa_en hotpotqa 2wikimqa musique trec triviaqa samsum gov_report qmsum multi_news passage_count passage_retrieval_en lcc repobench-p

MODE   = causal_lookahead
BUDGET = 128 256 512 1024

LAMBDA_RED = 0.5

# --- Lookahead particle generation (Eq. 4-8) ---
NUM_PARTICLES        = 4
LOOKAHEAD_LEN        = 8
LAMBDA_LOOKAHEAD     = 1.0
LOOKAHEAD_TEMPERATURE = 1.0

# --- Particle confidence weighting (Eq. 7-8): Prob + Entropy ---
LAMBDA_H     = 0.3    # entropy penalty ON: down-weights uncertain particles
PARTICLE_ETA = 1.0    # soft confidence weighting

# --- Score aggregation (Eq. 15-17): plain mean ---
ROBUST_ALPHA     = 0.0   # pure mean (no robust top-beta)
ROBUST_TOPK_BETA = 1.0   # all queries kept → TopAvg collapses to mean

# --- Chunk selection (Eq. 21): plain top-K ---
LAMBDA_K = 0.0   # no key-diversity penalty
LAMBDA_V = 0.0   # no value-diversity penalty

# --- Head-wise budget allocation (Eq. 20): adaptive ---
BUDGET_TAU = 1.0  # proportional to perturbation mass
