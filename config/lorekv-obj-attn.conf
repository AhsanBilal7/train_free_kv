# =============================================================================
# lorekv-obj-attn
#
# App. C (iii) PERTURBATION-OBJECTIVE ablation, Table "Ablations" row
# "Accumulated attention mass".
#
# Everything is the LORE-KV /E core (config/lorekv-ent-unif-topk.conf):
#   reliability (beta, gamma, lambda_D) = (1.0, 1.3, 0.0)
#   M = 4, T = 8, lambda_L = 1.0, uniform head budgets, plain top-K,
#   mean aggregation (alpha = 0, kappa = 1).
#
# The ONLY thing that changes is SCORE_OBJECTIVE, i.e. what Eq. 14 measures for
# a candidate token under a scoring query:
#
#   s_{q,i} = a_{q,i}   -- plain accumulated attention mass, the
#   H2O / SnapKV criterion, but read off the SAME window + lookahead queries
#
# The window + lookahead queries, the reliability weights omega_m and every
# downstream operator are identical to the core run, so the contrast against
# lorekv-ent-unif-topk at the same budget is single-factor and
# compute-matched (the same M x T particles are decoded either way).
#
# Output folder gets `_obj_attention` appended, so it never collides with the
# core run.
#
# Usage:
#   EXPERIMENT=LongBench CONFIG_FILE=config/lorekv-obj-attn.conf \
#       BUDGET=128 bash scripts/run_h100.sh
# =============================================================================

MODEL_PATH = mistralai/Mistral-7B-Instruct-v0.2

MODE   = causal_lookahead
BUDGET = 128

LAMBDA_RED = 0.5

# --- Perturbation objective (App. C (iii)) -- THE ABLATED AXIS ---
SCORE_OBJECTIVE = attention

# --- Lookahead particle generation (Eq. 1) ---
NUM_PARTICLES         = 4
LOOKAHEAD_LEN         = 8
LAMBDA_LOOKAHEAD      = 1.0
LOOKAHEAD_TEMPERATURE = 1.0

# --- Reliability weighting (Eq. 3 / Eq. 6): the /E core, unchanged ---
BETA                 = 1.0
GAMMA                = 1.3
LAMBDA_D             = 0.0
NORMALIZE_TYPICALITY = 0

# --- Score aggregation (App. C): plain mean (kappa = 1 collapses TopAvg to Mean) ---
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0

# --- Chunk selection (topk) ---
LAMBDA_K = 0.0
LAMBDA_V = 0.0

# --- Head-wise budget allocation (unif) ---
BUDGET_TAU = 0.0
