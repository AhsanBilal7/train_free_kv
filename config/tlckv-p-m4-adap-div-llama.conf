# =============================================================================
# C2 — tlckv-p-m4-adap-div
#
# Prob-only confidence · 4 particles · Adaptive budget · Diversity-aware
#
# Combines the Prob-only confidence of A2 with the diversity-aware greedy
# selection of C1.  Ablates both the entropy component (vs. C1) and the
# diversity penalty (vs. A2) simultaneously.
#
# Usage:
#   CONFIG_FILE=config/tlckv-p-m4-adap-div-llama.conf bash scripts/run_h100.sh
# =============================================================================

MODEL_PATH    = meta-llama/Llama-3.1-8B-Instruct

MODE   = causal_lookahead
BUDGET = 128 256 512 1024

LAMBDA_RED = 0.5

# --- Lookahead particle generation (Eq. 4-8) ---
NUM_PARTICLES        = 4
LOOKAHEAD_LEN        = 8
LAMBDA_LOOKAHEAD     = 1.0
LOOKAHEAD_TEMPERATURE = 1.0

# --- Particle confidence weighting (Eq. 7-8): Prob-only ---
LAMBDA_H     = 0.0    # entropy penalty OFF
PARTICLE_ETA = 1.0

# --- Score aggregation (Eq. 15-17): plain mean ---
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0

# --- Chunk selection (Eq. 21): DIVERSITY-AWARE greedy ---
LAMBDA_K = 0.1
LAMBDA_V = 0.1

# --- Head-wise budget allocation (Eq. 20): adaptive ---
BUDGET_TAU = 1.0
