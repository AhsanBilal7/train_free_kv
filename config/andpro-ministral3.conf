# =============================================================================
# andpro — original AnDPro baseline (Geng et al., 2026)
#
# Scores each chunk by projecting the attention-weighted value onto the
# pre-eviction output direction.  No lookahead, no counterfactual deletion,
# no robust aggregation, no adaptive head-wise budget — every parameter below
# the MODE/BUDGET block is IGNORED by this mode and left at neutral defaults
# only so the launcher's sweep loops stay valid.
#
# This config is benchmark-agnostic.  Pick the benchmark with EXPERIMENT;
# each experiment's run.sh supplies the dataset defaults (RULER -> the
# sequence-length configs 4096 / 8192 / 16384 on simonjegou/ruler).
#
# Usage (RULER):
#   EXPERIMENT=RULER CONFIG_FILE=config/andpro-ministral3.conf bash scripts/run_h100.sh
# =============================================================================

# Backbone: mistralai/Ministral-3-8B-Instruct-2512, text tower only. The published
# checkpoint is a Mistral3ForConditionalGeneration (Pixtral vision tower + ministral3
# text model, weights under a language_model. prefix); scripts/convert_ministral3.py
# extracts the text tower once into MODEL_PATH below. Prompts use Mistral's plain
# [INST]...[/INST] format rather than the packaged chat template, which would inject
# a long "Le Chat" system prompt ahead of every long-context input.
#
# transformers 4.44 predates ministral3, so the architecture is vendored in
# models_ext/ and registered with the Auto* factories by pred.py.

MODEL_PATH = /scratch/user/u.ab353540/models/Ministral-3-8B-Instruct-2512

MODE   = andpro
BUDGET = 128 256 512 1024

# --- Ignored by andpro: causal_forward_only redundancy penalty ---
LAMBDA_RED = 0.0

# --- Ignored by andpro: lookahead particle generation (Eq. 4-8) ---
NUM_PARTICLES         = 4
LOOKAHEAD_LEN         = 8
LAMBDA_LOOKAHEAD      = 1.0
LOOKAHEAD_TEMPERATURE = 1.0

# --- Ignored by andpro: particle confidence weighting (Eq. 7-8) ---
LAMBDA_H     = 0.0
PARTICLE_ETA = 1.0

# --- Ignored by andpro: robust score aggregation (Eq. 15-17) ---
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0

# --- Ignored by andpro: diversity-aware greedy selection (Eq. 21) ---
LAMBDA_K = 0.0
LAMBDA_V = 0.0

# --- Ignored by andpro: adaptive head-wise budget allocation (Eq. 19-20) ---
BUDGET_TAU = 1.0
