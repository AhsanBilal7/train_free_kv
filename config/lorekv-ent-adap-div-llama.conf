# =============================================================================
# lorekv-ent-adap-div-llama
#   reliability  (beta, gamma, lambda_D) = (1.0, 1.3, 0.0)
#   head budget  tau = 1.0   (adap)
#   selection    lambda_k = lambda_v = 0.1   (div)
#
# Reliability score (Eq. 3):
#     R_m = BETA * cbar_m  -  GAMMA * Hbar_m  -  LAMBDA_D * zscore_m(D)
#     cbar_m = (1/T) sum_u [ log q(y_u|h_u) + H(q(.|h_u)) ]     E[c_u | h_u] = 0
#     Hbar_m = (1/T) sum_u H(q(.|h_u))
#     omega  = softmax(R)                                       (no eta: absorbed)
#
# Relabels the published LORE-KV /E core exactly (old lambda_H = 0.3 -> gamma = 1.3).
# The -unif-topk variant is the paper's core configuration.
#
# ADAPTIVE head budgets (tau = 1): each head's budget is proportional to its
# total future-query perturbation mass E_{l,h}. Inherited from Ada-KV/PyramidKV.
#
# diversity-aware greedy selection: penalizes candidates whose keys/values are
# already covered by an earlier pick. Small values, so redundancy only breaks ties.
#
# Stage 1 of the reparametrized grid. Within a fixed adap-div suffix the
# ONLY thing that varies across the lorekv-* family is the reliability weighting,
# which is what makes the reliability comparison single-factor.
#
# Usage:
#   EXPERIMENT=LongBench CONFIG_FILE=config/lorekv-ent-adap-div-llama.conf \
#       BUDGET=128 bash scripts/run_h100.sh
# =============================================================================

MODEL_PATH = meta-llama/Llama-3.1-8B-Instruct

MODE   = causal_lookahead
BUDGET = 128

LAMBDA_RED = 0.5

# --- Lookahead particle generation (Eq. 1) ---
NUM_PARTICLES         = 4
LOOKAHEAD_LEN         = 8
LAMBDA_LOOKAHEAD      = 1.0
LOOKAHEAD_TEMPERATURE = 1.0

# --- Reliability weighting (Eq. 3 / Eq. 6) ---
BETA                 = 1.0
GAMMA                = 1.3
LAMBDA_D             = 0.0
NORMALIZE_TYPICALITY = 0

# --- Score aggregation (App. C): plain mean (kappa = 1 collapses TopAvg to Mean) ---
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0

# --- Chunk selection (div) ---
LAMBDA_K = 0.1
LAMBDA_V = 0.1

# --- Head-wise budget allocation (adap) ---
BUDGET_TAU = 1.0
