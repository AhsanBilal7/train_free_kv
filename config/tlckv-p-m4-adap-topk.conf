# =============================================================================
# A2 — tlckv-p-m4-adap-topk
#
# Prob-only confidence · 4 particles · Adaptive budget · Plain top-K
#
# Confidence weighting uses average log-probability only (Eq. 7 with LAMBDA_H=0):
# entropy is ignored so all particles compete purely on likelihood.  Ablates the
# entropy component of confidence weighting vs. A1 (tlckv-pe-m4-adap-topk).
# Everything else is identical to A1.
#
# Usage:
#   CONFIG_FILE=config/tlckv-p-m4-adap-topk.conf bash scripts/run_h100.sh
# =============================================================================

MODEL_PATH    = mistralai/Mistral-7B-Instruct-v0.2

MODE   = causal_lookahead
BUDGET = 128 256 512 1024

LAMBDA_RED = 0.5

# --- Lookahead particle generation (Eq. 4-8) ---
NUM_PARTICLES        = 4
LOOKAHEAD_LEN        = 8
LAMBDA_LOOKAHEAD     = 1.0
LOOKAHEAD_TEMPERATURE = 1.0

# --- Particle confidence weighting (Eq. 7-8): Prob-only ---
LAMBDA_H     = 0.0    # entropy penalty OFF: R_m = mean log-probability only
PARTICLE_ETA = 1.0    # soft confidence weighting

# --- Score aggregation (Eq. 15-17): plain mean ---
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0

# --- Chunk selection (Eq. 21): plain top-K ---
LAMBDA_K = 0.0
LAMBDA_V = 0.0

# --- Head-wise budget allocation (Eq. 20): adaptive ---
BUDGET_TAU = 1.0
