# CriticalKV baseline configuration.
# Backbone: Gemma-4-12B-it (hybrid attention). Paper: Tables 2, 9.
#
# `critical` routes through the Ada-KV adaptive cluster in adaptive_snapkv/
# (see lorekv/harness.py and the README).

# Prompts are capped at 31,500 tokens: the lookahead rollout clones the
# full-attention cache once per trajectory, which exceeds 80 GB at 64K on this
# backbone. The cap applies to every method so the comparison stays matched.
MODEL_PATH = models/gemma-4-12B-it
MAX_LENGTH = 31500
MODE = critical
BUDGET = 128 256 512 1024
