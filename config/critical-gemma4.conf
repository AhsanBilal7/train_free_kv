# critical baseline on gemma4 -- a HYBRID-attention backbone.
#
# Only the full-attention layers are compressed; the rest are already O(1) in
# context length (linear-attention recurrent state / bounded sliding window), so
# there is nothing for a cache-eviction method to do there. That still leaves the
# compressed layers holding the overwhelming majority of the cache at long
# context. See docs/HYBRID_ATTENTION.md and
# causal_lookahead_snapkv/monkeypatch/hybrid_support.py.
#
# MAX_LENGTH = 31500, same as Qwen2.5-14B, though for a different reason: gemma4's
# own context window (262144) does not require it, and critical (no lookahead
# clone) would fit 64k on its own. This cap exists only so andpro/critical are
# evaluated on the SAME input length as lorekv-ent/lorekv-dis on this backbone,
# which cannot fit a 64k causal_lookahead clone in 80 GiB -- measured 2026-09-19.
# See lorekv-ent-unif-topk-gemma4.conf for the OOM detail.
MODEL_PATH = /scratch/user/u.ab353540/models/gemma-4-12B-it
MAX_LENGTH = 31500
MODE   = critical
BUDGET = 128
LAMBDA_RED = 0.5
NUM_PARTICLES         = 4
LOOKAHEAD_LEN         = 8
LAMBDA_LOOKAHEAD      = 1.0
LOOKAHEAD_TEMPERATURE = 1.0
BETA                 = 1.0
GAMMA                = 1.3
LAMBDA_D             = 0.0
NORMALIZE_TYPICALITY = 0
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0
LAMBDA_K = 0.0
LAMBDA_V = 0.0
BUDGET_TAU = 0.0
