# =============================================================================
# C1 — tlckv-pe-m4-adap-div
#
# Prob+Entropy confidence · 4 particles · Adaptive budget · Diversity-aware
#
# Identical to A1 (tlckv-pe-m4-adap-topk) except chunk selection uses the
# diversity-aware greedy rule (Eq. 21): each newly selected chunk is penalised
# by its cosine similarity to already-selected chunk keys (LAMBDA_K=0.1) and
# values (LAMBDA_V=0.1).  Ablates the diversity penalty against A1.
#
# Note: small penalty values (0.1) ensure redundancy only breaks ties between
# similarly-scored chunks rather than overriding the perturbation score.
#
# Usage:
#   CONFIG_FILE=config/tlckv-pe-mx-adap-div-llama.conf bash scripts/run_h100.sh
# =============================================================================

MODEL_PATH    = meta-llama/Llama-3.1-8B-Instruct

MODE   = causal_lookahead
BUDGET = 128 256 512 1024

LAMBDA_RED = 0.5

# --- Lookahead particle generation (Eq. 4-8) ---
NUM_PARTICLES        = 2 4 8
LOOKAHEAD_LEN        = 8
LAMBDA_LOOKAHEAD     = 1.0
LOOKAHEAD_TEMPERATURE = 1.0

# --- Particle confidence weighting (Eq. 7-8): Prob + Entropy ---
LAMBDA_H     = 0.3
PARTICLE_ETA = 1.0

# --- Score aggregation (Eq. 15-17): plain mean ---
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0

# --- Chunk selection (Eq. 21): DIVERSITY-AWARE greedy ---
LAMBDA_K = 0.1   # key-cosine diversity penalty
LAMBDA_V = 0.1   # value-cosine diversity penalty

# --- Head-wise budget allocation (Eq. 20): adaptive ---
BUDGET_TAU = 1.0
