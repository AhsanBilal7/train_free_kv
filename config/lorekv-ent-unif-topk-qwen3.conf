# =============================================================================
# lorekv-ent-unif-topk-qwen3
#   reliability  (beta, gamma, lambda_D) = (1.0, 1.3, 0.0)
#   head budget  tau = 0.0   (unif)
#   selection    lambda_k = lambda_v = 0.0   (topk)
#
# Reliability score (Eq. 3):
#     R_m = BETA * cbar_m  -  GAMMA * Hbar_m  -  LAMBDA_D * zscore_m(D)
#     cbar_m = (1/T) sum_u [ log q(y_u|h_u) + H(q(.|h_u)) ]     E[c_u | h_u] = 0
#     Hbar_m = (1/T) sum_u H(q(.|h_u))
#     omega  = softmax(R)                                       (no eta: absorbed)
#
# Relabels the published LORE-KV /E core exactly (old lambda_H = 0.3 -> gamma = 1.3).
# The -unif-topk variant is the paper's core configuration.
#
# UNIFORM head budgets (tau = 0): every head gets an equal share of the layer
# budget. This is the core method's setting -- all main-text results use it.
#
# plain top-K selection: candidates ranked by score alone, no diversity penalty.
#
# Stage 1 of the reparametrized grid. Within a fixed unif-topk suffix the
# ONLY thing that varies across the lorekv-* family is the reliability weighting,
# which is what makes the reliability comparison single-factor.
#
# Usage:
#   EXPERIMENT=LongBench CONFIG_FILE=config/lorekv-ent-unif-topk-qwen3.conf \
#       BUDGET=128 bash scripts/run_h100.sh
# =============================================================================

# Backbone: Qwen/Qwen3-8B, run in NON-THINKING mode. Qwen3 is a hybrid reasoning
# model; pred.py's build_chat applies its chat template with enable_thinking=False,
# which is the template's own switch for the non-reasoning operating point. Left in
# thinking mode it spends the whole short LongBench budget inside <think> and every
# answer comes back empty, so this is not an optional detail.
#
# transformers 4.44 predates Qwen3, so the architecture is vendored in models_ext/
# and registered with the Auto* factories by pred.py. See models_ext/README.md.

MODEL_PATH = /scratch/user/u.ab353540/models/Qwen3-8B

MODE   = causal_lookahead
BUDGET = 128

LAMBDA_RED = 0.5

# --- Lookahead particle generation (Eq. 1) ---
NUM_PARTICLES         = 4
LOOKAHEAD_LEN         = 8
LAMBDA_LOOKAHEAD      = 1.0
LOOKAHEAD_TEMPERATURE = 1.0

# --- Reliability weighting (Eq. 3 / Eq. 6) ---
BETA                 = 1.0
GAMMA                = 1.3
LAMBDA_D             = 0.0
NORMALIZE_TYPICALITY = 0

# --- Score aggregation (App. C): plain mean (kappa = 1 collapses TopAvg to Mean) ---
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0

# --- Chunk selection (topk) ---
LAMBDA_K = 0.0
LAMBDA_V = 0.0

# --- Head-wise budget allocation (unif) ---
BUDGET_TAU = 0.0
