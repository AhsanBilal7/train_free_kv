# =============================================================================
# andpro-compute-eq -- compute-equivalent AnDPro (Mistral-7B, LongBench, B=128)
#
# AnDPro's scoring criterion (projected perturbation ||W_O Delta o||, Eq. 14) run
# on the SAME window + lookahead queries as LORE-KV: the identical M x T sampled
# continuations, decoded with the identical extra compute. The ONLY difference to
# config/lorekv-ent-unif-topk.conf is that the M particles are NOT reliability
# weighted (omega_m = 1/M, i.e. beta = gamma = lambda_D = 0). Head budgets, top-K
# selection, aggregation and chunking are unchanged, so the contrast against
# lorekv-ent-unif-topk at the same (M, T, B) is single-factor and compute-matched.
# Paper: App. C (iii), row "AnDPro scoring with the same continuations".
#
# RUN_NAME_PREFIX below overrides run_naming.py's derived identity ("uniform" cell,
# which would otherwise write lorekv-uniform-unif-topk_B_..., colliding with
# config/lorekv-uniform-unif-topk.conf's folders) so this writes
#   andpro-compute-eq_B_128_chunk_4_M_<M>_T_<T>_...
# instead -- the scoring criterion is AnDPro's, so the folder says AnDPro, not
# LORE-KV. run_naming.py's CUSTOM_PREFIXES registers the (beta, gamma, lambda_D,
# tau, lambda_k, lambda_v) this prefix stands for, so parse_run_name still recovers
# the numeric identity from folders written under it.
#
# M = 0 uses the prompt window only, is T-invariant, and does not depend on the
# reliability weights, so it equals the existing lorekv-ent-unif-topk M=0 run.
#
# Usage:
#   EXPERIMENT=LongBench CONFIG_FILE=config/andpro-compute-eq.conf \
#       NUM_PARTICLES="0 1 2 4 8" LOOKAHEAD_LEN="2 4 8 16 32" BUDGET=128 \
#       bash scripts/run_h100_aces.sh
# =============================================================================

MODEL_PATH = mistralai/Mistral-7B-Instruct-v0.2

MODE   = causal_lookahead
BUDGET = 128

RUN_NAME_PREFIX = andpro-compute-eq

LAMBDA_RED = 0.5

# --- Lookahead particle generation (Eq. 1) ---
NUM_PARTICLES         = 4
LOOKAHEAD_LEN         = 8
LAMBDA_LOOKAHEAD      = 1.0
LOOKAHEAD_TEMPERATURE = 1.0

# --- Reliability weighting OFF: uniform omega_m = 1/M ---
BETA                 = 0.0
GAMMA                = 0.0
LAMBDA_D             = 0.0
NORMALIZE_TYPICALITY = 0

# --- Score aggregation: plain mean ---
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0

# --- Chunk selection (topk) ---
LAMBDA_K = 0.0
LAMBDA_V = 0.0

# --- Head-wise budget allocation (unif) ---
BUDGET_TAU = 0.0
