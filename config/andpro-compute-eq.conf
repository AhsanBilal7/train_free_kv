# AnDPro's criterion on the same continuations (control of Table 13b and of the
# Table 14 row "AnDPro scoring with the same continuations").
# Backbone: Mistral-7B-Instruct-v0.2.
#
# The same prompt window and M x T lookahead queries as LORE-KV, the same budgets and
# selector, but each query set is scored with AnDPro's criterion (SCORE_OBJECTIVE =
# andpro) and the trajectories are weighted uniformly (beta = gamma = lambda_D = 0).
# Table 14 row: the budgets below at M = 4, T = 8.
# Table 13b: sweep the lookahead-token budget M x T with
#   NUM_PARTICLES="1 2 4 8" LOOKAHEAD_LEN="2 4 8 16 32" BUDGET=128

MODEL_PATH = mistralai/Mistral-7B-Instruct-v0.2
MODE = causal_lookahead
BUDGET = 128 256 512 1024
RUN_NAME_PREFIX = andpro-compute-eq

# Monte Carlo lookahead (Eq. 1) and its weight lambda_L in the final score (Eq. 7)
NUM_PARTICLES = 4
LOOKAHEAD_LEN = 8
LOOKAHEAD_TEMPERATURE = 1.0
LAMBDA_LOOKAHEAD = 1.0

# Trajectory reliability R_m = BETA * c_bar - GAMMA * H_bar - LAMBDA_D * D_hat (Eq. 3)
BETA = 0.0
GAMMA = 0.0
LAMBDA_D = 0.0
NORMALIZE_TYPICALITY = 0

# Plug-ins (App. D); all off in the core method
ROBUST_ALPHA = 0.0
ROBUST_TOPK_BETA = 1.0
BUDGET_TAU = 0.0
LAMBDA_K = 0.0
LAMBDA_V = 0.0

# Per-query score (App. D, ablation iii): AnDPro's chunk criterion
SCORE_OBJECTIVE = andpro
