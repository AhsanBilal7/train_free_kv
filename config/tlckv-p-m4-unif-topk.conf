# =============================================================================
# B2 — tlckv-p-m4-unif-topk
#
# Prob-only confidence · 4 particles · Uniform budget · Plain top-K
#
# Combines the Prob-only confidence of A2 with the uniform budget of B1.
# Ablates both the entropy component (vs. B1) and the adaptive budget (vs. A2)
# simultaneously.
#
# Usage:
#   CONFIG_FILE=config/tlckv-p-m4-unif-topk.conf bash scripts/run_h100.sh
# =============================================================================

MODEL_PATH    = mistralai/Mistral-7B-Instruct-v0.2
DATASET_PATH  = THUDM/LongBench
DATASET_NAME_LIST = qasper narrativeqa multifieldqa_en hotpotqa 2wikimqa musique trec triviaqa samsum gov_report qmsum multi_news passage_count passage_retrieval_en lcc repobench-p

MODE   = causal_lookahead
BUDGET = 128 256 512 1024

LAMBDA_RED = 0.5

# --- Lookahead particle generation (Eq. 4-8) ---
NUM_PARTICLES        = 4
LOOKAHEAD_LEN        = 8
LAMBDA_LOOKAHEAD     = 1.0
LOOKAHEAD_TEMPERATURE = 1.0

# --- Particle confidence weighting (Eq. 7-8): Prob-only ---
LAMBDA_H     = 0.0    # entropy penalty OFF
PARTICLE_ETA = 1.0

# --- Score aggregation (Eq. 15-17): plain mean ---
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0

# --- Chunk selection (Eq. 21): plain top-K ---
LAMBDA_K = 0.0
LAMBDA_V = 0.0

# --- Head-wise budget allocation (Eq. 20): UNIFORM ---
BUDGET_TAU = 0.0
