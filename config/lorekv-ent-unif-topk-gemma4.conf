# LORE-KV /E: entropy-penalized reliability weights (core configuration, Table 4).
# Backbone: Gemma-4-12B-it (hybrid attention). Paper: Tables 2, 9.

# Prompts are capped at 31,500 tokens: the lookahead rollout clones the
# full-attention cache once per trajectory, which exceeds 80 GB at 64K on this
# backbone. The cap applies to every method so the comparison stays matched.
MODEL_PATH = models/gemma-4-12B-it
# The tag marks runs with the Gemma 4 chat template; older gemma-4-12B-it folders
# used raw prompts and must not be resumed.
MODEL_TAG = gemma-4-12B-it-chat
MAX_LENGTH = 31500
MODE = causal_lookahead
BUDGET = 128 256 512 1024

# Monte Carlo lookahead (Eq. 1) and its weight lambda_L in the final score (Eq. 7)
NUM_PARTICLES = 4
LOOKAHEAD_LEN = 8
LOOKAHEAD_TEMPERATURE = 1.0
LAMBDA_LOOKAHEAD = 1.0

# Trajectory reliability R_m = BETA * c_bar - GAMMA * H_bar - LAMBDA_D * D_hat (Eq. 3)
BETA = 1.0
GAMMA = 1.3
LAMBDA_D = 0.0
NORMALIZE_TYPICALITY = 0

# Plug-ins (App. D); all off in the core method
ROBUST_ALPHA = 0.0
ROBUST_TOPK_BETA = 1.0
BUDGET_TAU = 0.0
LAMBDA_K = 0.0
LAMBDA_V = 0.0
