# LORE-KV /E: entropy-penalized reliability weights (core configuration, Table 4).
# Backbone: Qwen3.5-9B (hybrid attention). Paper: Tables 2, 8.

# MAX_LENGTH = 64000 exceeds every LongBench prompt (no truncation).
MODEL_PATH = models/Qwen3.5-9B
MAX_LENGTH = 64000
MODE = causal_lookahead
BUDGET = 128 256 512 1024

# Monte Carlo lookahead (Eq. 1) and its weight lambda_L in the final score (Eq. 7)
NUM_PARTICLES = 4
LOOKAHEAD_LEN = 8
LOOKAHEAD_TEMPERATURE = 1.0
LAMBDA_LOOKAHEAD = 1.0

# Trajectory reliability R_m = BETA * c_bar - GAMMA * H_bar - LAMBDA_D * D_hat (Eq. 3)
BETA = 1.0
GAMMA = 1.3
LAMBDA_D = 0.0
NORMALIZE_TYPICALITY = 0

# Plug-ins (App. D); all off in the core method
ROBUST_ALPHA = 0.0
ROBUST_TOPK_BETA = 1.0
BUDGET_TAU = 0.0
LAMBDA_K = 0.0
LAMBDA_V = 0.0
