# =============================================================================
# C3 — tlckv-m1-adap-div
#
# Single particle (M=1) · Adaptive budget · Diversity-aware
#
# Single lookahead continuation with adaptive budget and diversity-aware greedy
# selection.  Tests whether diversity selection adds value even when the
# future-query signal comes from only one particle.
#
# Usage:
#   CONFIG_FILE=config/tlckv-m1-adap-div.conf bash scripts/run_h100.sh
# =============================================================================

MODEL_PATH    = mistralai/Mistral-7B-Instruct-v0.2
DATASET_PATH  = THUDM/LongBench
DATASET_NAME_LIST = qasper narrativeqa multifieldqa_en hotpotqa 2wikimqa musique trec triviaqa samsum gov_report qmsum multi_news passage_count passage_retrieval_en lcc repobench-p

MODE   = causal_lookahead
BUDGET = 128 256 512 1024

LAMBDA_RED = 0.5

# --- Lookahead particle generation (Eq. 4-8): single particle ---
NUM_PARTICLES        = 1
LOOKAHEAD_LEN        = 8
LAMBDA_LOOKAHEAD     = 1.0
LOOKAHEAD_TEMPERATURE = 1.0

# --- Particle confidence weighting: moot for M=1 ---
LAMBDA_H     = 0.0
PARTICLE_ETA = 1.0

# --- Score aggregation (Eq. 15-17): plain mean ---
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0

# --- Chunk selection (Eq. 21): DIVERSITY-AWARE greedy ---
LAMBDA_K = 0.1
LAMBDA_V = 0.1

# --- Head-wise budget allocation (Eq. 20): adaptive ---
BUDGET_TAU = 1.0
