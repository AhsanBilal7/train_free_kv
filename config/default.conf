# =============================================================================
# LLM-AnDPro / TLC-KV LongBench experiment configuration
#
# Usage:
#   bash scripts/run_h100.sh                              # use this file
#   CONFIG_FILE=config/my_sweep.conf bash scripts/run_h100.sh
#
# Format:
#   PARAMETER_NAME = value
#   Lines starting with # are comments.  Blank lines are ignored.
#
# Sweeping:
#   Any parameter accepts multiple space-separated values.
#   The script will run one experiment per combination.
#   Example:  BUDGET = 128 256 512 1024
#             GAMMA = 0.0 1.0 1.3
#
# CLI overrides take precedence over this file:
#   BUDGET="128 256" MODE=andpro bash scripts/run_h100.sh
# =============================================================================


# =============================================================================
# Model
# =============================================================================

# Hugging Face Hub ID or local path of the causal-LM to evaluate.
MODEL_PATH = mistralai/Mistral-7B-Instruct-v0.2

# NOTE: Dataset configuration is now DATASET-SPECIFIC and lives in each
# experiment's run.sh (experiments/<EXPERIMENT>/run.sh), so a single method
# config works for both LongBench and RULER. Pick the benchmark with EXPERIMENT
# (e.g. `EXPERIMENT=RULER CONFIG_FILE=config/default.conf bash scripts/run_h100.sh`).
#   - DATASET_PATH        LongBench -> THUDM/LongBench   RULER -> simonjegou/ruler
#   - DATASET_NAME_LIST   LongBench -> the 16 sub-tasks  RULER -> 4096 8192 16384
# Override either only if you want to depart from the experiment default, e.g.
#   DATASET_NAME_LIST="qasper trec" ... bash scripts/run_h100.sh


# =============================================================================
# KV eviction mode  (§3 of the TLC-KV paper)
# =============================================================================
#
# Supported values:
#
#   andpro
#     Original AnDPro (Geng et al., 2026): scores each chunk by projecting the
#     attention-weighted value onto the pre-eviction output direction.
#
#   causal_forward_only
#     Training-Free Causal AnDPro: output-projection-aware leave-one-out
#     counterfactual deletion score (Eq. 13-14) evaluated ONLY under the
#     prompt observation-window queries (no lookahead). Optionally uses
#     LAMBDA_RED for a redundancy penalty in greedy chunk selection.
#
#   causal_lookahead
#     TLC-KV — full two-level training-free method (Algorithm 1):
#       (1) Generate M short lookahead continuations from the frozen model
#           (Eq. 1) and weight each by its reliability R_m (Eq. 3/6).
#       (2) Score each candidate KV pair by the output-projection-aware
#           counterfactual perturbation (Eq. 13-14) under both window
#           queries AND the confidence-weighted lookahead queries (Eq. 18).
#       (3) Aggregate scores robustly (Eq. 15-17), allocate head-wise
#           budgets (Eq. 19-20), and optionally apply diversity-aware
#           greedy selection (Eq. 21).
#
# Example sweep:  MODE = andpro causal_forward_only causal_lookahead
MODE = causal_lookahead


# =============================================================================
# KV cache budget  (shared across all modes)
# =============================================================================
#
# B: maximum number of KV pairs retained per head per layer after eviction.
# Smaller values → more compression → faster decode but lower accuracy.
# Example sweep:  BUDGET = 128 256 512 1024
BUDGET = 1024 256 512 128


# =============================================================================
# causal_forward_only — redundancy penalty  (ignored by andpro / causal_lookahead)
# =============================================================================
#
# lambda_red: weight of the redundancy penalty added to the greedy chunk-
#   selection score for causal_forward_only:
#     S_final(i) = S_causal(i) - LAMBDA_RED * max_j Red(i, j)
#
# To DISABLE redundancy penalty → revert to plain top-K chunk selection:
#   LAMBDA_RED = 0.0
#
# Example sweep:  LAMBDA_RED = 0.0 0.3 0.5
LAMBDA_RED = 0.5


# =============================================================================
# causal_lookahead — test-time lookahead particle generation  (Eq. 4-8)
#   All parameters in this section are ignored by andpro and causal_forward_only.
# =============================================================================

# NUM_PARTICLES (M, Eq. 5): number of short lookahead continuations generated
#   from the frozen model before final decoding.  All M particles are decoded in
#   parallel as one batched continuation, so wall-clock cost equals one length-T
#   decode, independent of M.  This cost is paid once, amortized over the full
#   output, and does not grow with output length.
#
# To DISABLE lookahead and use ONLY the prompt observation-window queries
#   for scoring (prompt-window output-perturbation, §3.11 / Eq. 18 with λ_L=0):
#
#     Preferred — set LAMBDA_LOOKAHEAD = 0.0
#       Skips the lookahead term in Eq. 18 without generating any particles.
#       Fastest option; no overhead at all.
#
#     Alternative — set NUM_PARTICLES = 0
#       No particles are sampled (the lookahead loop body never executes).
#       Slightly less efficient than LAMBDA_LOOKAHEAD=0 because the code still
#       enters the phase setup.
#
#   Both options recover the prompt-window-only scoring baseline at no added cost.
#
# Example sweep:  NUM_PARTICLES = 1 2 4 8
NUM_PARTICLES = 4

# LOOKAHEAD_LEN (T, Eq. 5): number of tokens in each lookahead continuation.
#   Longer T exposes more future query directions but increases the one-time
#   lookahead generation cost (wall-clock) proportionally.
#   Has no effect when LAMBDA_LOOKAHEAD = 0.0 or NUM_PARTICLES = 0.
# Example sweep:  LOOKAHEAD_LEN = 4 8 16
LOOKAHEAD_LEN = 8

# LAMBDA_LOOKAHEAD (lambda_L, Eq. 18): weight of the particle-weighted lookahead
#   score relative to the prompt observation-window score in the final token score:
#     S_i^{l,h} = rho(E_{i,W}) + lambda_L * sum_m [ omega_m * rho(E_{i,m}) ]
#
#   lambda_L = 0.0 → prompt-window-only scoring; the lookahead term is skipped
#              entirely.  No particles need to be generated (fastest setting).
#              Equivalent to causal_forward_only without the LAMBDA_RED penalty.
#
#   lambda_L > 0  → future-query-aware scoring.  The larger lambda_L, the more
#              the lookahead queries dominate the window queries in determining
#              which KV pairs to keep.  A value of 1.0 balances both sources.
#
# To USE ONLY window queries (no lookahead compute):  LAMBDA_LOOKAHEAD = 0.0
# To USE balanced window + lookahead:                 LAMBDA_LOOKAHEAD = 1.0  (default)
# Example sweep:  LAMBDA_LOOKAHEAD = 0.0 0.5 1.0 2.0
LAMBDA_LOOKAHEAD = 1.0

# LOOKAHEAD_TEMPERATURE: softmax sampling temperature used only to generate
#   lookahead particles (diverse stochastic continuations).  Higher values
#   produce more diverse but lower-probability particles.
#   Does NOT affect the final answer generation (always greedy).
#   Has no effect when LAMBDA_LOOKAHEAD = 0.0 or NUM_PARTICLES = 0.
# Example sweep:  LOOKAHEAD_TEMPERATURE = 0.5 1.0 1.5
LOOKAHEAD_TEMPERATURE = 1.0


# =============================================================================
# causal_lookahead — particle reliability weighting  (Eq. 3 / Eq. 6)
#   Ignored by andpro and causal_forward_only.
# =============================================================================
#
# For each sampled token, the CENTERED per-step score is
#
#     c_u = log q(y_u | X, y_<u)  +  H( q(. | X, y_<u) ),      E[c_u | h_u] = 0
#
# The particles are drawn from q itself, so E[log q(y_u)|h_u] = -H(q): the raw
# log-probability term ALREADY CONTAINS the entropy. Adding H back removes it, and
# what is left measures only how improbable the branch actually taken was *relative
# to the uncertainty at that context*. The trajectory score is then
#
#     R_m = BETA * cbar_m  -  GAMMA * Hbar_m  -  LAMBDA_D * zscore_m(D)
#     omega_m = softmax(R)_m
#
# Three INDEPENDENT channels, one coefficient each. There is no eta: it is not
# identifiable alongside (BETA, GAMMA, LAMBDA_D) and has been absorbed into them.
#
# Nesting (Prop. 1) -- the old (lambda_H, eta) parametrization in the new coordinates:
#
#     uniform weights                       BETA=0    GAMMA=0    LAMBDA_D=0
#     old "log-probability only"            BETA=1    GAMMA=1    LAMBDA_D=0
#     old LORE-KV /E (lambda_H = 0.3)       BETA=1    GAMMA=1.3  LAMBDA_D=0
#     old LORE-KV /D (lambda_D = 0.3)       BETA=1    GAMMA=1    LAMBDA_D=0.3
#     pure typicality (NEW)                 BETA=1    GAMMA=0    LAMBDA_D=0
#     disagreement w/o entropy (NEW)        BETA=1    GAMMA=0    LAMBDA_D=0.3
#
# Note what this makes visible: the old "log-probability only" row was NOT a
# no-penalty control -- it carries a full unit of entropy penalty. GAMMA = 0 was
# unreachable in the old parametrization, which is why the reported lambda_H sweep
# (gamma in [1, 1.3], a 23% perturbation along one ray) moved LongBench by 0.01.

# BETA (beta): TYPICALITY coefficient. Prices branch atypicality -- did this
#   particle take steps the model itself deemed improbable at the contexts it
#   visited? Because E[c_u | h_u] = 0, this channel contributes no zeroth-order
#   shift to the estimator's target; the tilt it induces is first-order in beta.
# Example sweep:  BETA = 0.0 0.5 1.0 2.0
BETA = 1.0

# GAMMA (gamma): ENTROPY coefficient. An explicit, deliberate preference for
#   low-uncertainty histories, matching the near-greedy operating point the deployed
#   system actually decodes from. GAMMA = 0 turns the entropy channel off entirely.
# Example sweep:  GAMMA = 0.0 1.0 1.3 2.0
GAMMA = 0.0

# LAMBDA_D (lambda_D): TRAJECTORY-DISAGREEMENT coefficient. For particle m,
#
#     D_m = 1/(M-1) sum_{r!=m} 1/(T|G|) sum_{u,g} [ 1 - cos(q^m_{u,g}, q^r_{u,g}) ]
#
#   i.e. the mean cosine distance between m's future-query trajectory and every
#   other particle's, over the T lookahead steps u and the (layer, head) groups g.
#   Matched queries sit at the same absolute position, so they carry the same
#   rotary phase and the cosine is directly comparable. D_m is standardized across
#   the M particles, so it sums to zero and only re-allocates mass WITHIN the sample.
#
#   Identically 0 for M <= 2: disagreement is undefined for one particle and
#   DEGENERATE for two (D_1 = D_2 by symmetry, so sd(D) = 0 and the z-score is 0/0).
#
#   Scale caveat: Hbar spans roughly 0-4 nats while zscore(D) is bounded by
#   sqrt(M-1) ~ 1.73 at M=4, so equal GAMMA and LAMBDA_D are NOT equal tilts.
#   Calibrate LAMBDA_D so that sd_m(LAMBDA_D * Dhat_m) matches sd_m(GAMMA * Hbar_m),
#   or report both channels' realized spread.
#
#   Default 0: carry LAMBDA_D > 0 into the end-to-end grid only once the semipartial
#   correlation of D_m with utility, controlling for (cbar_m, Hbar_m), is non-zero
#   and sign-consistent across benchmarks (test S4).
# Example sweep:  LAMBDA_D = 0.0 0.3 1.0
LAMBDA_D = 0.0

# NORMALIZE_TYPICALITY (0/1): replace cbar_m with the varentropy-normalized
#   ctilde_m = cbar_m / sqrt(Vbar_m / T), where V_u = Var_{y~q}[log q(y)]. The c_u are
#   a martingale difference sequence, so Var(cbar_m) = (1/T^2) sum_u E[V_u]: the
#   across-particle spread of cbar_m scales with the prompt's varentropy, and a single
#   global softmax scale is therefore not calibrated across prompts. ctilde_m has unit
#   scale by construction and is defined at every M >= 1.
#
#   This is an ABLATED SWITCH, not a default. Turn it on only if the across-prompt
#   ratio q95/q05 of sqrt(Vbar/T) exceeds ~2 (test V5); below ~1.3 leave it off.
NORMALIZE_TYPICALITY = 0

# DIVERGENCE_LAYER_STRIDE (optional, default 1): use every k-th decoder layer when
#   forming the (layer, head) group set G for D_m. 1 = all layers (recommended;
#   the cost is negligible next to the lookahead decode itself). Not part of the
#   sweep grid -- set it only if you want to sub-sample layers.
# DIVERGENCE_LAYER_STRIDE = 1

# =============================================================================
# causal_lookahead — robust score aggregation over queries  (Eq. 15-17)
#   Ignored by andpro and causal_forward_only.
#
# For each token i, the set of per-query perturbation scores E_{i,W} (window)
# and E_{i,m} (particle m) are aggregated via:
#   rho(E) = alpha * TopAvg_beta(E) + (1 - alpha) * Mean(E)    (Eq. 17)
# where TopAvg_beta keeps the top ceil(beta * |E|) scores (Eq. 16).
# This guards against average-case aggregation silently dropping tokens that
# matter only for a small subset of future queries.
# =============================================================================

# ROBUST_ALPHA (alpha, Eq. 17): mixture weight between the robust top-beta
#   average and the plain mean.
#   alpha = 0.0 → pure mean (ignores rare but important future queries;
#                 same as DefensiveKV / standard mean aggregation).
#   alpha = 1.0 → pure top-beta average (worst-case focused).
#   alpha = 0.5 → balanced (default); recommended starting point.
# Example sweep:  ROBUST_ALPHA = 0.0 0.5 1.0
ROBUST_ALPHA = 0.0
# ROBUST_ALPHA = 0.5

# ROBUST_TOPK_BETA (kappa in the paper; renamed from beta, which now denotes the
#   Eq. 3 typicality coefficient): fraction of the highest-scoring queries
#   kept in the robust top-beta average.  K_beta = ceil(beta * |E|).
#   beta = 1.0 → all queries kept; TopAvg_beta collapses to plain Mean,
#                making alpha irrelevant (fully disables robust aggregation).
#   beta = 0.5 → top 50% of per-query scores averaged (default).
# Example sweep:  ROBUST_TOPK_BETA = 0.25 0.5 0.75 1.0
ROBUST_TOPK_BETA = 1.0
# ROBUST_TOPK_BETA = 0.5


# =============================================================================
# causal_lookahead — diversity-aware greedy chunk selection  (Eq. 21)
#   Ignored by andpro and causal_forward_only.
#
# When lambda_k > 0 or lambda_v > 0, plain top-score ranking is replaced by
# a greedy rule that penalizes near-duplicate key/value chunks:
#   i* = argmax_i [ S_i - lambda_k * max_j cos(k_i, k_j)
#                        - lambda_v * max_j cos(v_i, v_j) ]   (Eq. 21)
# where j ranges over already-selected chunks.
#
# Caution: a cosine penalty can wrongly discard evidence that is repeated but
# genuinely important (e.g., the same entity across multiple supporting passages
# in multi-document QA).  Three design choices limit this risk:
#   (a) both penalties default to 0.0 (feature is off by default);
#   (b) the penalty is applied to the perturbation score S_i, not raw features,
#       so high-perturbation duplicates are still retained;
#   (c) keep values small so redundancy only breaks ties.
# =============================================================================

# LAMBDA_K (lambda_k, Eq. 21): key-similarity cosine diversity penalty.
# To DISABLE diversity-aware selection (plain top-score ranking):
#   LAMBDA_K = 0.0  AND  LAMBDA_V = 0.0  (both must be zero)
# Example sweep:  LAMBDA_K = 0.0 0.1 0.5
LAMBDA_K = 0.0

# LAMBDA_V (lambda_v, Eq. 21): value-similarity cosine diversity penalty.
# To DISABLE diversity-aware selection (plain top-score ranking):
#   LAMBDA_V = 0.0  AND  LAMBDA_K = 0.0  (both must be zero)
# Example sweep:  LAMBDA_V = 0.0 0.1 0.5
LAMBDA_V = 0.0


# =============================================================================
# causal_lookahead — adaptive head-wise budget allocation  (Eq. 19-20)
#   Ignored by andpro and causal_forward_only.
#
# The per-layer budget B_l is redistributed across heads proportionally to
# each head's total future-query perturbation mass E_{l,h} (Eq. 19), raised to
# the power tau before normalizing (Eq. 20):
#   B_{l,h} = floor[ B_l * (E_{l,h} + eps)^tau
#                        / sum_{h'} (E_{l,h'} + eps)^tau ]
# =============================================================================

# BUDGET_TAU (tau, Eq. 20): concentration exponent for head-wise budget
#   allocation.
#   tau = 0.0 → uniform budget; all heads receive the same number of KV pairs
#               (adaptive allocation is disabled; equivalent to flat per-head budget).
#   tau = 1.0 → linear proportional allocation to perturbation mass (default).
#   tau > 1.0 → increasingly aggressive; concentrates budget on heads whose
#               candidate deletions cause the largest future-query perturbations.
#
# To DISABLE adaptive head-wise allocation (uniform budget per head):
#   BUDGET_TAU = 0.0
#
# Example sweep:  BUDGET_TAU = 0.0 0.5 1.0 2.0
BUDGET_TAU = 1.0
