# =============================================================================
# lorekv-dis-unif-topk-qwen2
#   reliability  (beta, gamma, lambda_D) = (1.0, 1.0, 0.3)
#   head budget  tau = 0.0   (unif)
#   selection    lambda_k = lambda_v = 0.0   (topk)
#
# Reliability score (Eq. 3):
#     R_m = BETA * cbar_m  -  GAMMA * Hbar_m  -  LAMBDA_D * zscore_m(D)
#     cbar_m = (1/T) sum_u [ log q(y_u|h_u) + H(q(.|h_u)) ]     E[c_u | h_u] = 0
#     Hbar_m = (1/T) sum_u H(q(.|h_u))
#     omega  = softmax(R)                                       (no eta: absorbed)
#
# Relabels the published LORE-KV /D core exactly. NOTE it also carries gamma = 1:
# it ADDS disagreement on top of a full entropy penalty rather than replacing it.
#
# UNIFORM head budgets (tau = 0): every head gets an equal share of the layer
# budget. This is the core method's setting -- all main-text results use it.
#
# plain top-K selection: candidates ranked by score alone, no diversity penalty.
#
# Stage 2 of the reparametrized grid. Within a fixed unif-topk suffix the
# ONLY thing that varies across the lorekv-* family is the reliability weighting,
# which is what makes the reliability comparison single-factor.
#
# Usage:
#   EXPERIMENT=LongBench CONFIG_FILE=config/lorekv-dis-unif-topk-qwen2.conf \
#       BUDGET=128 bash scripts/run_h100.sh
# =============================================================================

# Backbone: Qwen/Qwen2.5-14B-Instruct. Unlike the other extra backbone it needs no
# vendoring -- `qwen2` is native to the pinned transformers 4.44 -- but its 4.44
# implementation predates the rotary refactor (no `position_embeddings`, a
# table-based rotary indexed by `position_ids`), so the eviction hijacks use the
# Qwen2-specific forwards generated by scripts/gen_ext_hijacks.py.
#
# Prompts go through the model's ChatML template (pred.py's build_chat); without it
# Qwen2.5-Instruct continues the document instead of answering.
#
# NOTE this is a 14B model, roughly twice the parameters of the other three
# backbones: ~28 GB of weights in bf16 before the KV cache, so it needs the H100
# and is correspondingly slower per sample.

MODEL_PATH = /scratch/user/u.ab353540/models/Qwen2.5-14B-Instruct

MODE   = causal_lookahead
BUDGET = 128

LAMBDA_RED = 0.5

# --- Lookahead particle generation (Eq. 1) ---
NUM_PARTICLES         = 4
LOOKAHEAD_LEN         = 8
LAMBDA_LOOKAHEAD      = 1.0
LOOKAHEAD_TEMPERATURE = 1.0

# --- Reliability weighting (Eq. 3 / Eq. 6) ---
BETA                 = 1.0
GAMMA                = 1.0
LAMBDA_D             = 0.3
NORMALIZE_TYPICALITY = 0

# --- Score aggregation (App. C): plain mean (kappa = 1 collapses TopAvg to Mean) ---
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0

# --- Chunk selection (topk) ---
LAMBDA_K = 0.0
LAMBDA_V = 0.0

# --- Head-wise budget allocation (unif) ---
BUDGET_TAU = 0.0
