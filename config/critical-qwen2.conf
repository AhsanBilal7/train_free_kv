# CriticalKV baseline (Feng et al., ICML 2025).
# Backbone: Qwen2.5-14B-Instruct. Paper: Table 11.
#
# Ada-KV head budgets, then the two-stage CriticalKV selection: half of each head
# budget by window attention, the rest by (attention + eps) * ||v W_O||_1
# (adaptive_snapkv/monkeypatch/snapkv_utils.py). Runs write criticalkv_* folders.

# Prompts are middle-truncated to 31,500 tokens to stay inside Qwen2.5-14B's
# 32K context window (App. E.3); the cap applies to every method.
MODEL_PATH = models/Qwen2.5-14B-Instruct
MAX_LENGTH = 31500
MODE = critical
BUDGET = 128 256 512 1024
