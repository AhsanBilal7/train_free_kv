# =============================================================================
# fullcache-qwen3 — uncompressed reference for Qwen3-8B
#
# MODE = test is pred.py's unpatched path ("Base mode"): no replace_* hijack is
# installed, so the model decodes from the complete KV cache. It is the Full Cache
# row of the LongBench tables, and the denominator for every recovery percentage.
#
# BUDGET is carried only because run.sh's sweep loops and the output-folder name
# require it; nothing is evicted, so one value is the whole run.
#
# Usage:
#   EXPERIMENT=LongBench CONFIG_FILE=config/fullcache-qwen3.conf bash scripts/run_h100.sh
# =============================================================================

MODEL_PATH = /scratch/user/u.ab353540/models/Qwen3-8B

MODE   = test
BUDGET = 128

# --- All ignored by the unpatched path; present so the sweep loops stay valid ---
LAMBDA_RED = 0.0
NUM_PARTICLES         = 4
LOOKAHEAD_LEN         = 8
LAMBDA_LOOKAHEAD      = 1.0
LOOKAHEAD_TEMPERATURE = 1.0
BETA                 = 1.0
GAMMA                = 1.3
LAMBDA_D             = 0.0
NORMALIZE_TYPICALITY = 0
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0
LAMBDA_K = 0.0
LAMBDA_V = 0.0
BUDGET_TAU = 0.0
