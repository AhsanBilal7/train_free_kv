# =============================================================================
# fullcache-qwen2 — uncompressed reference for Qwen2.5-14B-Instruct
#
# MODE = test is pred.py's unpatched path ("Base mode"): no replace_* hijack is
# installed, so the model decodes from the complete KV cache. It is the Full Cache
# row of the LongBench tables, and the denominator for every recovery percentage.
#
# BUDGET is carried only because run.sh's sweep loops and the output-folder name
# require it; nothing is evicted, so one value is the whole run.
#
# Usage:
#   EXPERIMENT=LongBench CONFIG_FILE=config/fullcache-qwen2.conf bash scripts/run_h100.sh
# =============================================================================

MODEL_PATH = /scratch/user/u.ab353540/models/Qwen2.5-14B-Instruct

# Prompt truncation. Qwen2.5-14B's context window is 32768 and it has no RoPE
# scaling, while LongBench's narrativeqa reaches ~64k tokens; the repo default of
# 64000 (i.e. no truncation) would score half that task outside the range the model
# was trained for, and would also not fit in an 80 GB H100 alongside three copies of
# a 64k KV cache. 31500 + the largest LongBench max_gen (512) stays inside 32768.
# The same value is used for every method, so the comparison within this backbone is
# unaffected; across backbones it is a documented difference in input length.
MAX_LENGTH = 31500

MODE   = test
BUDGET = 128

# --- All ignored by the unpatched path; present so the sweep loops stay valid ---
LAMBDA_RED = 0.0
NUM_PARTICLES         = 4
LOOKAHEAD_LEN         = 8
LAMBDA_LOOKAHEAD      = 1.0
LOOKAHEAD_TEMPERATURE = 1.0
BETA                 = 1.0
GAMMA                = 1.3
LAMBDA_D             = 0.0
NORMALIZE_TYPICALITY = 0
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0
LAMBDA_K = 0.0
LAMBDA_V = 0.0
BUDGET_TAU = 0.0
