# =============================================================================
# A3 — tlckv-m1-adap-topk
#
# Single particle (M=1) · Adaptive budget · Plain top-K
#
# One lookahead continuation is generated.  With M=1 the confidence softmax
# always assigns weight 1.0 to that single particle, so LAMBDA_H and
# PARTICLE_ETA have no effect.  This isolates the future-query direction signal
# itself from the benefit of multiple diverse particles: if A3 underperforms A1
# or A2, the gain from multiple particles is meaningful; if not, a single sample
# is sufficient.
#
# Usage:
#   CONFIG_FILE=config/tlckv-m1-adap-topk.conf bash scripts/run_h100.sh
# =============================================================================

MODEL_PATH    = mistralai/Mistral-7B-Instruct-v0.2
DATASET_PATH  = THUDM/LongBench
DATASET_NAME_LIST = qasper narrativeqa multifieldqa_en hotpotqa 2wikimqa musique trec triviaqa samsum gov_report qmsum multi_news passage_count passage_retrieval_en lcc repobench-p

MODE   = causal_lookahead
BUDGET = 1024 256 512 128

LAMBDA_RED = 0.5

# --- Lookahead particle generation (Eq. 4-8): single particle ---
NUM_PARTICLES        = 1     # M=1: confidence weighting has no effect
LOOKAHEAD_LEN        = 8
LAMBDA_LOOKAHEAD     = 1.0
LOOKAHEAD_TEMPERATURE = 1.0

# --- Particle confidence weighting: moot for M=1, kept at neutral values ---
LAMBDA_H     = 0.0
PARTICLE_ETA = 1.0

# --- Score aggregation (Eq. 15-17): plain mean ---
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0

# --- Chunk selection (Eq. 21): plain top-K ---
LAMBDA_K = 0.0
LAMBDA_V = 0.0

# --- Head-wise budget allocation (Eq. 20): adaptive ---
BUDGET_TAU = 1.0
