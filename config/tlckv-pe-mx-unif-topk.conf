# =============================================================================
# B1 — tlckv-pe-m4-unif-topk
#
# Prob+Entropy confidence · 4 particles · Uniform budget · Plain top-K
#
# Identical to A1 (tlckv-pe-m4-adap-topk) except the head-wise budget is
# uniform (BUDGET_TAU=0.0): every attention head receives an equal share of the
# layer budget regardless of its perturbation mass.  Ablates the contribution
# of adaptive head-wise budget allocation against A1.
#
# Usage:
#   CONFIG_FILE=config/tlckv-pe-m4-unif-topk.conf bash scripts/run_h100.sh
# =============================================================================

MODEL_PATH    = mistralai/Mistral-7B-Instruct-v0.2
DATASET_PATH  = THUDM/LongBench
DATASET_NAME_LIST = qasper narrativeqa multifieldqa_en hotpotqa 2wikimqa musique trec triviaqa samsum gov_report qmsum multi_news passage_count passage_retrieval_en lcc repobench-p

MODE   = causal_lookahead
BUDGET = 128 256 512 1024

LAMBDA_RED = 0.5

# --- Lookahead particle generation (Eq. 4-8) ---
NUM_PARTICLES        = 2 4 8
LOOKAHEAD_LEN        = 8
LAMBDA_LOOKAHEAD     = 1.0
LOOKAHEAD_TEMPERATURE = 1.0

# --- Particle confidence weighting (Eq. 7-8): Prob + Entropy ---
LAMBDA_H     = 0.3
PARTICLE_ETA = 1.0

# --- Score aggregation (Eq. 15-17): plain mean ---
ROBUST_ALPHA     = 0.0
ROBUST_TOPK_BETA = 1.0

# --- Chunk selection (Eq. 21): plain top-K ---
LAMBDA_K = 0.0
LAMBDA_V = 0.0

# --- Head-wise budget allocation (Eq. 20): UNIFORM ---
BUDGET_TAU = 0.0  # tau=0 → equal budget per head (adaptive allocation disabled)
