    "pytest==9.1.1",
    "ruff==0.16.3",
    "black==26.5.1",
    "mypy==2.3.1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
cache-dir = "/scratch/user/u.ab353540/uv_cache"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.4.0/flash_attn-2.4.0%2Bcu122torch2.1cxx11abiFALSE-cp311-cp311-linux_x86_64.whl" }
