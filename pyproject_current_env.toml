requires-python = ">=3.11,<3.12"

dependencies = [
    "torch==2.1.2",
    "transformers==4.44.2",
    "tokenizers==0.19.1",
    "flash-attn==2.4.0",
    "triton==2.1.0",
    "accelerate==1.14.0",
    "datasets==4.8.4",
    "huggingface-hub==0.36.2",
    "safetensors==0.8.0",
    "numpy==1.26.4",
    "pandas==3.0.5",
    "pyarrow==25.0.0",
    "matplotlib==3.11.1",
    "pillow==12.3.0",
    "einops==0.8.2",
    "tiktoken==0.13.0",
    "sentencepiece==0.2.2",
    "protobuf==7.35.1",
    "fschat==0.2.36",
    "jieba==0.42.1",
    "rouge==1.0.1",
    "rouge-score==0.1.2",
    "nltk==3.10.0",
    "fuzzywuzzy==0.18.0",
    "python-levenshtein==0.27.3",
    "pypdf==6.16.2",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "tqdm==4.70.0",
    "rich==15.0.0",
    "psutil==7.2.2",
    "ninja==1.13.0",
    "packaging",
    "setuptools>=68,<81",
]

[dependency-groups]
